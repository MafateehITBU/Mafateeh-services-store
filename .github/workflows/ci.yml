name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mafateeh_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mafateeh_store
      SESSION_SECRET: ci-session-secret-ci-session-secret
      SITE_URL: http://localhost:3010
      SMTP_HOST: localhost
      SMTP_PORT: "2525"
      SMTP_USER: ci
      SMTP_PASS: ci
      SMTP_FROM: ci@example.com
      MAIL_JSON: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: gitleaks/gitleaks-action@v2
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm exec -- prisma migrate deploy
      - run: npm exec -- prisma validate
      - run: npm test
      - run: npm run build
